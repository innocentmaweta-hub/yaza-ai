name: Build Yaza AI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Validate serverless API JavaScript
        run: |
          for file in api/*.js lib/*.js; do
            node --check "$file"
          done
      - run: npm run build